name: GitHub人审状态更新
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions:
  contents: write
concurrency:
  group: film-state-main
  cancel-in-progress: false
jobs:
  review:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: State machine
        run: python3 scripts/review.py --event "$GITHUB_EVENT_PATH" --owner "$GITHUB_REPOSITORY_OWNER"
      - name: Commit verified review status
        run: |
          git add data/projects.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "workflow: human review status"
          git push origin HEAD:main
